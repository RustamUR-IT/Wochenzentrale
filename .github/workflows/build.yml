name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - run: gradle testDebugUnitTest assembleDebug --no-daemon
      - name: Release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Wochenzentrale.apk
          gh release create "build-${{ github.run_number }}" Wochenzentrale.apk --title "build-${{ github.run_number }}" --notes "Debug-APK, installiert sich über die vorherige Version."
